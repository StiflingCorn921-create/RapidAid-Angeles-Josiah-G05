{% extends "base.html" %}

{% block title %}Delete Incident - RapidAid{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card card-custom shadow-sm">
      <div class="card-header">Confirm Deletion</div>
      <div class="card-body p-4">
        <p class="mb-3">Are you sure you want to delete the incident report:</p>
        <p class="fw-bold text-rapidaid-dark mb-4">"{{ incident.title }}" ({{ incident.location }})?</p>

        <form method="post">
          {% csrf_token %}
          <div class="d-flex justify-content-between">
            <a href="{% url 'incident_detail' incident.pk %}" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-danger px-4">Yes, Delete</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
