{% extends "base.html" %}

{% block title %}Page Not Found (404) - RapidAid{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-6 text-center">
    <div class="card card-custom shadow-sm p-4">
      <h1 class="display-4 fw-bold text-rapidaid-dark">404</h1>
      <h4 class="mb-3">Page Not Found</h4>
      <p class="text-muted mb-4">The page or record you are looking for does not exist or has been removed.</p>
      <div>
        <a href="{% url 'dashboard' %}" class="btn btn-rapidaid">Back to Dashboard</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
